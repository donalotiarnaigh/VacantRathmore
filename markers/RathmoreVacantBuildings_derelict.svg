<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple derelict building icon -->
  <rect x="3" y="8" width="18" height="13" fill="#8B4513" stroke="#333" stroke-width="1"/>
  
  <!-- Roof -->
  <polygon points="3,8 12,3 21,8" fill="#654321" stroke="#333" stroke-width="1"/>
  
  <!-- Door -->
  <rect x="10" y="15" width="4" height="6" fill="#2F2F2F" stroke="#333" stroke-width="1"/>
  
  <!-- Windows (dark/boarded up) -->
  <rect x="5" y="10" width="3" height="3" fill="#2F2F2F" stroke="#666" stroke-width="1"/>
  <rect x="16" y="10" width="3" height="3" fill="#2F2F2F" stroke="#666" stroke-width="1"/>
  
  <!-- Derelict indicator -->
  <circle cx="12" cy="6" r="1.5" fill="#FF0000"/>
</svg> 